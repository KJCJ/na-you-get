<!DOCTYPE html>
<html>
<head>
  <base href="/na-you-get/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Na You Get - the business operating system for Sierra Leone.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Na You Get</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #nyg-banner {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateY(120%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.35s ease, opacity 0.35s ease;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom)) 14px;
      background: linear-gradient(135deg, #0D47A1 0%, #072E66 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.28);
    }
    #nyg-banner.nyg-show {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    #nyg-banner .nyg-icon { font-size: 22px; line-height: 1; }
    #nyg-banner .nyg-text { flex: 1; font-size: 14px; font-weight: 600; }
    #nyg-banner .nyg-sub {
      display: block; font-size: 11px; font-weight: 400;
      opacity: 0.75; margin-top: 2px;
    }
    #nyg-banner .nyg-get {
      background: #fff; color: #0D47A1; border: none;
      border-radius: 999px; padding: 9px 16px;
      font-size: 13px; font-weight: 700;
      text-decoration: none; white-space: nowrap;
    }
    #nyg-banner .nyg-close {
      background: rgba(255,255,255,0.18); color: #fff; border: none;
      border-radius: 50%; width: 26px; height: 26px;
      font-size: 14px; line-height: 1; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="nyg-banner">
    <span class="nyg-icon">&#128241;</span>
    <span class="nyg-text">
      Get the Na You Get App!
      <span class="nyg-sub">Faster, installs in seconds</span>
    </span>
    <a class="nyg-get"
       href="https://github.com/KJCJ/na-you-get/releases/latest/download/NaYouGet.apk">Install</a>
    <button class="nyg-close" id="nyg-close" aria-label="Dismiss">&times;</button>
  </div>

  <script>
    (function () {
      var KEY = 'nyg-banner-dismissed';
      var banner = document.getElementById('nyg-banner');
      if (!banner) return;

      var isAndroid = /Android/i.test(navigator.userAgent);
      var dismissed = false;
      try { dismissed = localStorage.getItem(KEY) === '1'; } catch (e) {}

      if (!isAndroid || dismissed) return;
      banner.classList.add('nyg-show');

      var hideTimer = setTimeout(function () {
        banner.classList.remove('nyg-show');
      }, 8000);

      document.getElementById('nyg-close').addEventListener('click', function () {
        clearTimeout(hideTimer);
        banner.classList.remove('nyg-show');
        try { localStorage.setItem(KEY, '1'); } catch (e) {}
      });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
